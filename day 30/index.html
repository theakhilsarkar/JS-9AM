<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container d-flex gap-3 my-5 justify-content-center">
      <div>
        <input
          id="input-id-text"
          type="text"
          class="form-control"
          placeholder="id"
        />
      </div>
      <div>
        <input
          id="input-name-text"
          type="text"
          class="form-control"
          placeholder="name"
        />
      </div>
      <div>
        <input
          id="input-course-text"
          type="text"
          class="form-control"
          placeholder="course"
        />
      </div>
      <button id="btn-submit" class="btn btn-primary">Submit</button>
      <button id="btn-read" class="btn btn-warning">Read</button>
      <button id="btn-delete" class="btn btn-danger">Delete</button>
    </div>
    <div class="container">
      <p id="output-id-text" class="text-center"></p>
      <p id="output-name-text" class="text-center"></p>
      <p id="output-course-text" class="text-center"></p>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
